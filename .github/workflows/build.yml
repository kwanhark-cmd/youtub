name: 개인비서 검사와 빌드

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['0*_**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Releases 에 새 버전 올리기 (apps/assistant/pubspec.yaml 버전으로 태그)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'
  LINUX_DEPS: libgtk-3-dev ninja-build clang cmake pkg-config liblzma-dev libsqlite3-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libsecret-1-dev libjpeg-dev

jobs:
  test:
    name: 검사·테스트 (다섯 모듈 + 공통 + 본체)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: flutter pub get
      - name: 코드 검사 (공통·본체)
        run: |
          (cd packages/core && flutter analyze)
          (cd apps/assistant && flutter analyze)
      - name: 공통 테스트
        working-directory: packages/core
        run: flutter test
      - name: 본체 테스트 (통합 흐름·가져오기·금고 호환)
        working-directory: apps/assistant
        run: flutter test
      - name: 채널 모듈 기존 테스트
        working-directory: packages/channel
        run: flutter test
      - name: 대화 모듈 기존 테스트
        working-directory: packages/chats
        run: flutter test
      - name: 비우기 모듈 기존 테스트
        working-directory: packages/declutter
        run: flutter test
      - name: 금고 모듈 기존 테스트 (호환 테스트 포함)
        working-directory: packages/vault
        run: flutter test

  engine-test:
    name: 하드 엔진 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modules_src/harddisk/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8

  linux:
    name: 리눅스
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: flutter pub get
      - working-directory: apps/assistant
        run: flutter build linux --release
      - run: tar -czf gaein-biseo-linux.tar.gz -C apps/assistant/build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: gaein-biseo-linux.tar.gz

  android:
    name: 안드로이드
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 서명 열쇠는 쓰지 않는다 (빌드마다 임시 열쇠). 그래서 새 버전은 "기존 앱 지우고 설치"이고,
      # 그 전에 앱 밖에 백업 파일을 저장하라는 안내가 Releases 설명 맨 위에 들어간다.
      # 내려받기가 가끔 끊겨 실패하면 30초 뒤 한 번만 다시 한다.
      - name: 안드로이드 설치 파일 만들기
        working-directory: apps/assistant
        run: flutter build apk --release || (echo "한 번 더 시도합니다" && sleep 30 && flutter build apk --release)
      - run: cp apps/assistant/build/app/outputs/flutter-apk/app-release.apk gaein-biseo-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: gaein-biseo-android.apk

  windows:
    name: 윈도우
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/assistant
        run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path apps/assistant/build/windows/x64/runner/Release/* -DestinationPath gaein-biseo-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: gaein-biseo-windows.zip

  macos:
    name: 맥
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/assistant
        run: flutter build macos --release
      - run: cd apps/assistant/build/macos/Build/Products/Release && ditto -c -k --keepParent *.app "$GITHUB_WORKSPACE/gaein-biseo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: gaein-biseo-macos.zip

  release:
    name: Releases 에 올리기
    needs: [test, linux, android, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 버전
        run: |
          V=$(grep -E '^version:' apps/assistant/pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')
          echo "V=$V" >> $GITHUB_ENV
          echo "TAG=v$V" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 설치 안내 + 변경 내역 + 해시
        # 설치 안내가 맨 위: 이미 설치된 앱의 업데이트 창과 Releases 첫 화면에 먼저 보이는 곳.
        run: |
          cat > notes.md <<'NOTES'
          **안드로이드 (gaein-biseo-android.apk)** — 기존 앱 위에 덮어 설치가 안 돼요. 기존 앱을 지우면 앱 안 자료도 함께 지워지니 꼭 이 순서대로 해 주세요.
          1. **먼저 백업**: 금고·대화·비우기·채널 모듈의 설정에서 각각 백업 파일을 만들고, 저장 창에서 앱 밖(다운로드 폴더·구글 드라이브·내 메일 등)을 골라 저장해요. 백업 비밀번호도 적어 두세요.
          2. 아래 **gaein-biseo-android.apk** 를 받아요.
          3. 기존 개인비서 앱을 지워요. (로그인·열쇠·하드 연결 번호도 함께 지워져요)
          4. 받은 파일을 눌러 설치해요.
          5. 새로 로그인한 뒤, 각 모듈 설정의 되살리기(복원) 단추로 백업 파일을 불러와요 (금고는 새 금고를 먼저 만든 뒤 불러와요). 구글 JSON·AI 열쇠·하드 연결 번호는 다시 넣어 주세요.
          자세한 순서(모듈별 단추 이름): https://github.com/kwanhark-cmd/youtub/blob/main/docs/개인비서_사용법.md

          **윈도우·맥·리눅스** — 새 파일을 받아 기존 앱을 새 것으로 바꿔요 (윈도우·리눅스는 압축을 풀어 기존 폴더를 바꾸고, 맥은 응용 프로그램 폴더의 앱을 바꿔요). 내 자료는 사용자 폴더에 있어 그대로 남아요.
          맥에서 처음 열 때 "열 수 없음" 안내가 나오면: 시스템 설정 → 개인정보 보호 및 보안 → 아래쪽 "그래도 열기".

          NOTES
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md >> notes.md
          printf "\n**SHA256** (받은 파일이 맞는지 직접 확인할 때)\n\`\`\`\n" >> notes.md
          (cd out && sha256sum *) >> notes.md
          printf '```\n' >> notes.md
          cat notes.md
      - name: 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* --title "개인비서 $V" --notes-file notes.md --target "$GITHUB_SHA"
          fi
