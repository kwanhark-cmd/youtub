name: 메타지우개 플러스 검사와 빌드

on:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/metaclean/**', '.github/workflows/metaclean.yml']
  workflow_dispatch:
    inputs:
      publish_anyway:
        description: '이미 올라간 버전에서 이어지지 않는 커밋이라도 업데이트로 올리기 (보통은 끄고 둡니다)'
        type: boolean
        default: false
      stamp_build:
        description: '열쇠가 등록되지 않았어도 앱에 빌드 번호를 새기기 (고정 열쇠로 따로 서명할 때만 켭니다)'
        type: boolean
        default: false

# 기본은 읽기만. 올리기 작업(release)만 쓰기 권한을 따로 받는다.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: 검사·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 가지에 새 푸시가 오면 앞선 실행은 그만둔다 (가장 새 것만 빌드·배포).
    concurrency:
      group: metaclean-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 의존성 설치
        working-directory: apps/metaclean
        run: flutter pub get
      - name: 코드 검사
        working-directory: apps/metaclean
        run: flutter analyze
      - name: 테스트
        working-directory: apps/metaclean
        run: flutter test

  apk:
    name: 안드로이드 APK 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: metaclean-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 안드로이드 뼈대 생성
        working-directory: apps/metaclean
        run: flutter create --platforms=android --org com.kwanhark --project-name metaclean .
      - name: 앱 이름·권한 설정
        working-directory: apps/metaclean
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="metaclean"/android:label="메타지우개 플러스"/' "$M"
          # INTERNET: 새 버전 확인에만 쓴다. WRITE_EXTERNAL_STORAGE: 옛 안드로이드(9 이하) 갤러리 저장용.
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" \/>\n    <application/' "$M"
          cat "$M"
          grep -q 'android:label="메타지우개 플러스"' "$M"
          grep -q 'android.permission.INTERNET' "$M"
      - name: APK 빌드
        working-directory: apps/metaclean
        env:
          # 빌드 번호는 실행할 때마다 1씩 커진다. 안드로이드는 번호가 같거나 커야 덮어 설치해 준다.
          BUILD: ${{ github.run_number }}
          # 고정 열쇠가 등록돼 있는지만 알려 준다 (열쇠 값은 이 작업에 주지 않는다).
          HAS_KEY: ${{ secrets.METACLEAN_KEYSTORE_BASE64 != '' || inputs.stamp_build == true }}
        run: |
          VER="$(sed -n -E 's/^version:[[:space:]]*([0-9][^+[:space:]]*).*/\1/p' pubspec.yaml | head -1)"
          test -n "$VER"
          # 고정 열쇠로 서명될 빌드에만 "빌드 번호"를 새긴다. 번호가 없는 앱은 시험판으로
          # 표시되고, 켤 때 새 버전을 찾지 않는다 (시험용 열쇠로는 덮어 설치가 안 되므로).
          APP_BUILD=0
          if [ "$HAS_KEY" = "true" ]; then APP_BUILD="$BUILD"; fi
          echo "버전 $VER · 빌드 $BUILD · 앱에 새기는 번호 $APP_BUILD"
          flutter build apk --release --build-name="$VER" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VER" --dart-define=APP_BUILD="$APP_BUILD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/unsigned.apk"
          jq -n --argjson build "$BUILD" --arg version "$VER" --arg commit "$GITHUB_SHA" \
            --rawfile notes update_notes.txt \
            '{build: $build, version: $version, commit: $commit, notes: $notes}' \
            > "$GITHUB_WORKSPACE/out/version.json"
          cat "$GITHUB_WORKSPACE/out/version.json"
      - name: 빌드 결과 넘기기 (서명 전)
        uses: actions/upload-artifact@v4
        with:
          name: metaclean-build
          path: out/
          if-no-files-found: error
          retention-days: 3

  sign:
    # 서명 열쇠는 이 작업에서만 쓴다. 여기서는 바깥에서 받아 온 코드(플러터 도구,
    # 패키지, 빌드 플러그인)를 실행하지 않고, 러너에 깔려 있는 도구만 쓴다.
    name: 서명 (고정 열쇠가 등록돼 있으면 그 열쇠로)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metaclean-build
          path: in
      - name: 서명
        id: sign
        env:
          # 열쇠 파일은 저장소에 두지 않고 GitHub Secrets 에만 둔다.
          # 열쇠 파일 자체가 비밀이라, 파일을 여는 암호는 고정값을 쓴다.
          KEYSTORE_BASE64: ${{ secrets.METACLEAN_KEYSTORE_BASE64 }}
        run: |
          mkdir -p out
          cp in/version.json out/version.json
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
          KS="$RUNNER_TEMP/metaclean.p12"
          signed=false
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null || true
            if keytool -list -keystore "$KS" -storepass metaclean -alias metaclean >/dev/null 2>&1; then
              "${BT}apksigner" sign --ks "$KS" --ks-pass pass:metaclean --ks-key-alias metaclean \
                --out out/metaclean-plus.apk in/unsigned.apk
              signed=true
            else
              echo "::warning::METACLEAN_KEYSTORE_BASE64 값을 열쇠로 읽지 못했어요. 값을 처음부터 끝까지 다시 붙여 넣어 주세요. 이번에는 시험용 열쇠로 서명된 시험판만 남깁니다."
            fi
            rm -f "$KS"
          else
            echo "::warning::METACLEAN_KEYSTORE_BASE64 가 없어 시험용 열쇠로 서명된 시험판만 남깁니다. 시험판은 기존 앱 위에 덮어 설치되지 않고, 업데이트로 올라가지 않습니다."
          fi
          rm -f out/*.idsig
          if [ "$signed" = true ]; then
            APK=out/metaclean-plus.apk
          else
            # 시험판은 이름을 달리해서 정식 설치 파일과 헷갈리지 않게 한다.
            APK=out/metaclean-plus-test.apk
            cp in/unsigned.apk "$APK"
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          # 서명한 열쇠의 지문(공개 정보). 빌드마다 같아야 덮어 설치가 된다.
          "${BT}apksigner" verify --print-certs "$APK" | grep 'certificate SHA-256'
      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 메타지우개플러스-APK
          path: out/
          if-no-files-found: error

  release:
    name: 업데이트로 올리기 (고정 열쇠로 서명됐을 때만)
    needs: sign
    if: needs.sign.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # 올리는 도중에는 끊지 않는다.
    concurrency:
      group: metaclean-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 메타지우개플러스-APK
          path: out
      - name: Releases 의 고정 주소에 올리기
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 앱이 새 버전을 찾아보는 고정 주소. 개인비서의 "최신 Release" 와 섞이지 않게 prerelease 로 둔다.
          # 꼬리표(tag)는 주소 역할만 하고 옮기지 않는다. 어느 커밋으로 만들었는지는 version.json 에 적는다.
          TAG: metaclean-latest
          PUBLISH_ANYWAY: ${{ inputs.publish_anyway }}
        run: |
          NEW="$(jq -r .build version.json)"
          VER="$(jq -r .version version.json)"
          OLD=0
          OLD_COMMIT=""
          if gh release download "$TAG" -p version.json -O "$RUNNER_TEMP/old.json" 2>/dev/null; then
            OLD="$(jq -r '.build // 0' "$RUNNER_TEMP/old.json" 2>/dev/null || echo 0)"
            OLD_COMMIT="$(jq -r '.commit // ""' "$RUNNER_TEMP/old.json" 2>/dev/null || echo "")"
          fi
          case "$OLD" in ''|*[!0-9]*) OLD=0 ;; esac
          if [ "$OLD" -ge "$NEW" ]; then
            echo "이미 같거나 더 새 빌드($OLD)가 올라가 있어 건너뜁니다."
            exit 0
          fi
          # 이미 올라간 버전의 내용을 모두 담은 커밋만 업데이트로 올린다.
          # (옛 커밋에서 갈라진 다른 작업 가지가 고친 내용을 되돌려 놓는 일을 막는다.)
          if [ -n "$OLD_COMMIT" ] && [ "$PUBLISH_ANYWAY" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            STATUS="$(gh api "repos/$GH_REPO/compare/$OLD_COMMIT...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)"
            if [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; then
              echo "::warning::이 커밋은 이미 올라간 버전(빌드 $OLD, ${OLD_COMMIT:0:7})에서 이어지지 않아(상태: $STATUS) 업데이트로 올리지 않습니다. 그래도 올리려면 이 워크플로를 publish_anyway 를 켜고 직접 실행하세요."
              exit 0
            fi
          fi
          TITLE="메타지우개 플러스 $VER (빌드 $NEW)"
          NUMBERED_NAME="metaclean-plus-$NEW.apk"
          {
            echo "## 달라진 점"
            jq -r .notes version.json
            echo
            echo "## 설치·업데이트 방법"
            echo "1. 아래 **metaclean-plus.apk** 를 눌러 내려받습니다. (\`$NUMBERED_NAME\` 도 같은 파일입니다)"
            echo "2. 내려받은 파일을 열고 **업데이트**(처음이면 **설치**)를 누릅니다."
            echo
            echo "같은 주소에서 받은 앱이 이미 깔려 있으면, 지우지 않아도 그 위에 바로 설치됩니다."
            echo
            echo "만든 커밋: $GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          # 같은 설치 파일을 두 이름으로 올린다.
          #  - metaclean-plus-<빌드>.apk : 앱의 [새 버전 받기]가 여는 파일. 버전마다 이름이 달라서
          #    폰의 내려받기 폴더에서 옛 파일과 헷갈리지 않는다.
          #  - metaclean-plus.apk        : 처음 설치할 때 쓰는, 이름이 늘 같은 파일.
          NUMBERED="metaclean-plus-$NEW.apk"
          cp metaclean-plus.apk "$NUMBERED"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 설치 파일을 먼저, 안내 파일(version.json)을 나중에 올린다.
            gh release upload "$TAG" "$NUMBERED" --clobber
            gh release upload "$TAG" metaclean-plus.apk --clobber
            gh release upload "$TAG" version.json --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          else
            gh release create "$TAG" "$NUMBERED" metaclean-plus.apk version.json \
              --prerelease --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # 옛 번호의 설치 파일은 지운다 (실패해도 배포는 끝난 것으로 본다).
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E '^metaclean-plus-[0-9]+\.apk$' | grep -vxF "$NUMBERED" \
            | while read -r OLD_APK; do
                gh release delete-asset "$TAG" "$OLD_APK" --yes || true
              done || true
