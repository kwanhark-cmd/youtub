name: 메타지우개 플러스 검사와 빌드

on:
  push:
    branches: [main, 'claude/**']
    paths: ['apps/metaclean/**', '.github/workflows/metaclean.yml']
  workflow_dispatch:
    inputs:
      publish_anyway:
        description: '이미 올라간 버전에서 이어지지 않는 커밋이라도 새 버전으로 올리기 (보통은 끄고 둡니다)'
        type: boolean
        default: false

# 기본은 읽기만. 올리기 작업(release)만 쓰기 권한을 따로 받는다.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: 검사·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 가지에 새 푸시가 오면 앞선 실행은 그만둔다 (가장 새 것만 빌드·배포).
    concurrency:
      group: metaclean-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 의존성 설치
        working-directory: apps/metaclean
        run: flutter pub get
      - name: 코드 검사
        working-directory: apps/metaclean
        run: flutter analyze
      - name: 테스트
        working-directory: apps/metaclean
        run: flutter test

  apk:
    name: 안드로이드 APK 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: metaclean-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 안드로이드 뼈대 생성
        working-directory: apps/metaclean
        run: flutter create --platforms=android --org com.kwanhark --project-name metaclean .
      - name: 앱 이름·권한 설정
        working-directory: apps/metaclean
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="metaclean"/android:label="메타지우개 플러스"/' "$M"
          # INTERNET: 새 버전 확인에만 쓴다. WRITE_EXTERNAL_STORAGE: 옛 안드로이드(9 이하) 갤러리 저장용.
          # 사진을 원본 그대로(촬영 위치 포함) 읽기: 앱 안 고르기 화면이 폰의 사진 보관함(MediaStore)에서
          # 직접 읽는다 (photo_manager, setRequireOriginal). 시스템 고르기 창은 위치를 가려서 넘겨준다.
          #   READ_MEDIA_IMAGES: 사진 보기 (안드로이드 13+)
          #   READ_MEDIA_VISUAL_USER_SELECTED: 안드로이드 14+ "일부 사진만 허용"을 앱이 알아듣게
          #   READ_EXTERNAL_STORAGE(maxSdkVersion 32): 사진 보기 (안드로이드 12 이하)
          #   ACCESS_MEDIA_LOCATION: 사진 속 촬영 위치를 가리지 않고 읽기 (안드로이드 10+)
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" \/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" \/>\n    <application/' "$M"
          cat "$M"
          grep -q 'android:label="메타지우개 플러스"' "$M"
          grep -q 'android.permission.INTERNET' "$M"
          grep -q 'android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"' "$M"
          grep -q 'android.permission.READ_MEDIA_IMAGES' "$M"
          grep -q 'android.permission.READ_MEDIA_VISUAL_USER_SELECTED' "$M"
          grep -q 'android.permission.ACCESS_MEDIA_LOCATION' "$M"
          # 권한이 꼭 한 번씩만 들어갔는지 (두 번 들어가면 매니페스트 합치기가 깨질 수 있다)
          test "$(grep -c '<uses-permission' "$M")" -eq 6
          # 권한 부품(permission_handler)이 안드로이드 37 기준으로 만들어져 있다 (사진 보관함 부품 photo_manager 는 36). 개인비서와 같게 맞춘다.
          G=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = maxOf(flutter.compileSdkVersion, 37)/' "$G"
          grep -q 'compileSdk = maxOf(flutter.compileSdkVersion, 37)' "$G"
      - name: APK 빌드
        working-directory: apps/metaclean
        env:
          # 빌드 번호는 실행할 때마다 1씩 커진다. 번호가 큰 것이 새 버전이다.
          BUILD: ${{ github.run_number }}
        run: |
          VER="$(sed -n -E 's/^version:[[:space:]]*([0-9][^+[:space:]]*).*/\1/p' pubspec.yaml | head -1)"
          test -n "$VER"
          echo "버전 $VER · 빌드 $BUILD"
          # 서명 열쇠를 따로 두지 않는다. 설치 파일은 빌드할 때마다 새로 만들어지는 임시 열쇠로
          # 서명되므로, 새 버전은 기존 앱을 지운 뒤 설치한다 (앱과 설명서가 그렇게 안내한다).
          flutter build apk --release --build-name="$VER" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VER" --dart-define=APP_BUILD="$BUILD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/metaclean-plus.apk"
          jq -n --argjson build "$BUILD" --arg version "$VER" --arg commit "$GITHUB_SHA" \
            --rawfile notes update_notes.txt \
            '{build: $build, version: $version, commit: $commit, notes: $notes}' \
            > "$GITHUB_WORKSPACE/out/version.json"
          cat "$GITHUB_WORKSPACE/out/version.json"
      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 메타지우개플러스-APK
          path: out/
          if-no-files-found: error

  release:
    # 누구나(로그인 없이) 어느 폰에서나 받을 수 있는 고정 주소에 새 버전을 올린다.
    # 이 작업에서는 바깥에서 받아 온 코드를 실행하지 않는다.
    name: 내려받기 주소에 올리기
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # 올리는 도중에는 끊지 않는다.
    concurrency:
      group: metaclean-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 메타지우개플러스-APK
          path: out
      - name: Releases 의 고정 주소에 올리기
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 앱이 새 버전을 찾아보는 고정 주소. 개인비서의 "최신 Release" 와 섞이지 않게 prerelease 로 둔다.
          # 꼬리표(tag)는 주소 역할만 하고 옮기지 않는다. 어느 커밋으로 만들었는지는 version.json 에 적는다.
          TAG: metaclean-latest
          PUBLISH_ANYWAY: ${{ inputs.publish_anyway }}
        run: |
          NEW="$(jq -r .build version.json)"
          VER="$(jq -r .version version.json)"
          OLD=0
          OLD_COMMIT=""
          if gh release download "$TAG" -p version.json -O "$RUNNER_TEMP/old.json" 2>/dev/null; then
            OLD="$(jq -r '.build // 0' "$RUNNER_TEMP/old.json" 2>/dev/null || echo 0)"
            OLD_COMMIT="$(jq -r '.commit // ""' "$RUNNER_TEMP/old.json" 2>/dev/null || echo "")"
          fi
          case "$OLD" in ''|*[!0-9]*) OLD=0 ;; esac
          if [ "$OLD" -ge "$NEW" ]; then
            echo "이미 같거나 더 새 빌드($OLD)가 올라가 있어 건너뜁니다."
            exit 0
          fi
          # 이미 올라간 버전의 내용을 모두 담은 커밋만 새 버전으로 올린다.
          # (옛 커밋에서 갈라진 다른 작업 가지가 고친 내용을 되돌려 놓는 일을 막는다.)
          if [ -n "$OLD_COMMIT" ] && [ "$PUBLISH_ANYWAY" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            STATUS="$(gh api "repos/$GH_REPO/compare/$OLD_COMMIT...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)"
            if [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; then
              echo "::warning::이 커밋은 이미 올라간 버전(빌드 $OLD, ${OLD_COMMIT:0:7})에서 이어지지 않아(상태: $STATUS) 새 버전으로 올리지 않습니다. 그래도 올리려면 이 워크플로를 publish_anyway 를 켜고 직접 실행하세요."
              exit 0
            fi
          fi
          TITLE="메타지우개 플러스 $VER (빌드 $NEW)"
          # 같은 설치 파일을 두 이름으로 올린다.
          #  - metaclean-plus.apk        : 이름이 늘 같은 파일. 처음 설치하거나 다른 폰에 설치할 때 쓴다.
          #  - metaclean-plus-<빌드>.apk : 앱의 [새 버전 받기]가 여는 파일. 버전마다 이름이 달라서
          #    폰의 내려받기 폴더에서 옛 파일과 헷갈리지 않는다.
          NUMBERED="metaclean-plus-$NEW.apk"
          cp metaclean-plus.apk "$NUMBERED"
          {
            echo "## 설치 방법"
            echo "1. 아래 **metaclean-plus.apk** 를 눌러 내려받습니다. (\`$NUMBERED\` 도 같은 파일입니다)"
            echo "2. **이미 깔려 있는 메타지우개 플러스가 있으면 먼저 지웁니다.** (지우지 않으면 설치되지 않습니다)"
            echo "3. 내려받은 파일을 열고 **설치**를 누릅니다."
            echo
            echo "갤러리에 저장한 사진은 앱을 지워도 그대로 남습니다."
            echo
            echo "## 달라진 점"
            jq -r .notes version.json
            echo
            echo "만든 커밋: $GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 설치 파일을 먼저, 안내 파일(version.json)을 나중에 올린다.
            gh release upload "$TAG" "$NUMBERED" --clobber
            gh release upload "$TAG" metaclean-plus.apk --clobber
            gh release upload "$TAG" version.json --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          else
            gh release create "$TAG" "$NUMBERED" metaclean-plus.apk version.json \
              --prerelease --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # 옛 번호의 설치 파일은 지운다 (실패해도 배포는 끝난 것으로 본다).
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E '^metaclean-plus-[0-9]+\.apk$' | grep -vxF "$NUMBERED" \
            | while read -r OLD_APK; do
                gh release delete-asset "$TAG" "$OLD_APK" --yes || true
              done || true
