<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>PC 엔진 찾기</title>
<style>
 body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:20px;background:#f3f5fa;color:#0f172a;margin:0;display:grid;place-items:center;min-height:100vh}
 .card{background:#fff;border-radius:20px;padding:28px;max-width:560px;box-shadow:0 6px 0 rgba(15,23,42,.18)}
 button{min-height:56px;width:100%;border:0;border-radius:16px;font-size:20px;font-weight:700;margin-top:12px;cursor:pointer}
 .a{background:#c2410c;color:#fff}.g{background:#e8edf6;color:#0f172a}
 input{min-height:56px;width:100%;font-size:20px;border-radius:16px;border:2px solid #cbd5e1;padding:0 14px;box-sizing:border-box;margin-top:12px}
</style></head>
<body><div class="card">
<h1>PC 엔진을 찾을 수 없어요</h1>
<ol><li>윈도우 PC가 켜져 있는지 확인해 주세요.</li><li>PC에서 '하드 자료 찾기 비서'가 실행 중인지 확인해 주세요.</li>
<li>이 컴퓨터가 PC와 같은 와이파이에 있는지 확인해 주세요.</li><li>PC 설정에서 '다른 기기에서 보기'를 켜 주세요.</li></ol>
<button class="a" onclick="window.hdShell.retry()">다시 찾기</button>
<input id="addr" placeholder="PC 주소 (예: 192.168.0.10:47810)" aria-label="PC 주소">
<button class="g" onclick="window.hdShell.manual(document.getElementById('addr').value).then(ok=>{if(!ok)alert('그 주소에서 찾지 못했어요.')})">이 주소로 연결</button>
</div></body></html>
