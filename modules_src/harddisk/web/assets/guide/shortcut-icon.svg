<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="바로가기 아이콘 바꾸는 방법 그림" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect width="720" height="300" rx="20" fill="#f3f5fa"/>
<text x="24" y="40" font-size="22" font-weight="700" fill="#0f172a">윈도우: 바탕화면 아이콘 바꾸기</text>
<g font-size="17" fill="#0f172a">
<rect x="24" y="60" width="155" height="100" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="48" cy="84" r="16" fill="#1d4ed8"/><text x="42" y="90" fill="#fff" font-weight="700">1</text><text x="38" y="125">아이콘을</text><text x="38" y="147">오른쪽 클릭</text>
<rect x="196" y="60" width="155" height="100" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="220" cy="84" r="16" fill="#1d4ed8"/><text x="214" y="90" fill="#fff" font-weight="700">2</text><text x="210" y="125">'속성'</text><text x="210" y="147">누르기</text>
<rect x="368" y="60" width="155" height="100" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="392" cy="84" r="16" fill="#1d4ed8"/><text x="386" y="90" fill="#fff" font-weight="700">3</text><text x="382" y="125">'아이콘 변경'</text><text x="382" y="147">누르기</text>
<rect x="540" y="60" width="155" height="100" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="564" cy="84" r="16" fill="#1d4ed8"/><text x="558" y="90" fill="#fff" font-weight="700">4</text><text x="554" y="125">받은 아이콘</text><text x="554" y="147">(.ico) 고르기</text>
</g>
<text x="24" y="210" font-size="22" font-weight="700" fill="#0f172a">맥: 앱 아이콘 바꾸기</text>
<text x="24" y="245" font-size="17" fill="#0f172a">① 응용 프로그램 폴더에서 앱 선택 → ② ⌘+I(정보 가져오기) → ③ 받은 아이콘 그림을 왼쪽 위 작은 아이콘 위로 끌어다 놓기</text>
<text x="24" y="275" font-size="15" fill="#475569">안드로이드: 크롬에서 PC 주소를 열고 '홈 화면에 추가'를 누르면 바꾼 이름·아이콘으로 만들어져요.</text>
</svg>
